<!-- product-form.html -->
<div class="container mt-4" *ngIf="product">
  <h2>{{ product.id ? 'Edit Product' : 'Create Product' }}</h2>

  <form (ngSubmit)="onSave()" #productForm="ngForm" class="mt-3">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input [(ngModel)]="product.name" name="name" class="form-control" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea [(ngModel)]="product.description" name="description" class="form-control"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">SKU</label>
      <input [(ngModel)]="product.sku" name="sku" class="form-control" />
    </div>

    <div class="mb-3">
      <label class="form-label">Price</label>
      <input type="number" [(ngModel)]="product.price" name="price" class="form-control" />
    </div>

    <div class="mb-3">
      <label class="form-label">Quantity</label>
      <input type="number" [(ngModel)]="product.quantity" name="quantity" class="form-control" />
    </div>

    <div class="mb-3">
      <label class="form-label">Category</label>
      <select [(ngModel)]="product.categoryId" name="categoryId" class="form-select" required>
        <option [ngValue]="undefined">-- Select Category --</option>
        <option *ngFor="let cat of categories" [ngValue]="cat.id">
          {{ cat.name }}
        </option>
      </select>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success">Save</button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    </div>
  </form>
</div>
<app-loading-overlay [loading]="loading"></app-loading-overlay>
