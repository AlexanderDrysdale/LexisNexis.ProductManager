<!-- product-list.html -->
<div class="mb-3 d-flex gap-2">
  <input class="form-control w-auto" placeholder="Filter by name"
         (input)="onFilterChange($event.target.value, categoryId$.value)" />
  <input type="number" class="form-control w-auto" placeholder="Category ID"
         (input)="onFilterChange(name$.value, $event.target.valueAsNumber)" />
  <button class="btn btn-success" (click)="onAddNew()">
    + Add New Product
  </button>
</div>

<table class="table table-striped table-hover table-bordered">
  <thead class="table-primary">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Description</th>
      <th>SKU</th>
      <th>Price</th>
      <th>Quantity</th>
      <th>Category</th>
      <th class="text-center">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let product of (products$ | async)?.items || []">
      <td>{{ product.id }}</td>
      <td>{{ product.name }}</td>
      <td>{{ product.description }}</td>
      <td>{{ product.sku }}</td>
      <td>{{ product.price | currency }}</td>
      <td>{{ product.quantity }}</td>
      <td>{{ product.categoryId }}</td>
      <td class="text-center">
        <button class="btn btn-sm btn-warning me-2" (click)="onEdit(product)">
          Edit
        </button>
        <button class="btn btn-sm btn-danger" (click)="onDelete(product)">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>

<nav class="d-flex justify-content-center align-items-center gap-3">
  <button class="btn btn-primary"
          (click)="onPageChange({pageIndex: (pageNumber$.value || 1) - 2, pageSize: pageSize$.value})"
          [disabled]="(pageNumber$.value || 1) <= 1">
    ‹ Previous
  </button>
  <span class="fw-bold">Page {{ pageNumber$.value }}</span>
  <button class="btn btn-primary"
          (click)="onPageChange({pageIndex: (pageNumber$.value || 1), pageSize: pageSize$.value})"
          [disabled]="((products$ | async)?.items?.length || 0) < (pageSize$.value || 10)">
    Next ›
  </button>
</nav>

<app-loading-overlay [loading]="loading"></app-loading-overlay>
